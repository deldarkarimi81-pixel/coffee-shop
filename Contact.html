<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class=" bg-[#fff8f0]">

    <section class="py-16 px-5 md:px-10 bg-[#faf8f5]">

        <div class="max-w-5xl mx-auto">

            <div class="text-center mb-10">
                <i class="fa-solid fa-envelope text-4xl text-[#6f4e37] mb-4"></i>

                <h2 class="text-3xl md:text-4xl font-bold text-[#6f4e37] mb-4">
                    Contact Us
                </h2>

                <p class="text-gray-600 leading-7 max-w-2xl mx-auto">
                    We'd love to hear from you! Whether you have a question,
                    a suggestion, or simply want to say hello, feel free to
                    get in touch with us.
                </p>
            </div>

            <div class="grid md:grid-cols-3 gap-6 text-center p-5">
                <div class="bg-white rounded-2xl p-6 shadow-md">
                    <i class="fa-solid fa-location-dot text-2xl text-[#6f4e37] mb-4"></i>

                    <h3 class="text-lg font-bold text-[#6f4e37]">
                        Our Location
                    </h3>

                    <p class="text-gray-500 mt-2">
                        Seoul, South Korea
                    </p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-md">
                    <i class="fa-solid fa-phone text-2xl text-[#6f4e37] mb-4"></i>

                    <h3 class="text-lg font-bold text-[#6f4e37]">
                        Call Us
                    </h3>

                    <p class="text-gray-500 mt-2">
                        +82 10 1234 5678
                    </p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-md">
                    <i class="fa-solid fa-envelope text-2xl text-[#6f4e37] mb-4"></i>

                    <h3 class="text-lg font-bold text-[#6f4e37]">
                        Email Us
                    </h3>

                    <p class="text-gray-500 mt-2">
                        DalCafe@gmail.com
                    </p>
                </div>
            </div>
        </div>
    </section>
    <div class="  flex justify-center mt-16 mb-10">
        <a href="about.html" class="border-2 border-[#6f4e37] text-[#6f4e37]
              px-10 py-3 rounded-full font-medium
              hover:bg-[#6f4e37] hover:text-white
              transition duration-300">
            previous
            <i class="fa-solid fa-arrow-left ml-2"></i>
        </a>
    </div>
</body>

</html>
